# BFME1 Mobile: порядок монтирования .big (E1-21). Правило: docs/formats/bfme1-big-order.md.
# Формат строки:
#   layer <имя> <приоритет> <каталог> <flat|recursive> <last-wins|first-wins> <маска> [<маска>...]
# - Архив относится к слою с наибольшим приоритетом, чьи каталог и маска (по имени файла, без учёта
#   регистра) подходят. Слой с большим приоритетом всегда перекрывает слой с меньшим.
# - Каталог: "." = корень игры (BFME_GAMEDATA), относительный путь от корня или абсолютный.
# - Внутри слоя архивы сортируются по относительному пути через _stricmp (без учёта регистра, с приведением
#   к нижнему регистру, поэтому "_" идёт раньше букв), как их перебирает движок ZH.
#   Ключ сравнения использует разделитель "/". ZH на Windows сравнивает "\". После общего префикса
#   порядок может разойтись на цифре или точке; на текущем наборе архивов порядок тот же.
# - Имена, которые отличаются только регистром, монтируются один раз (FilenameList ZH). Если на диске
#   лежат оба, остаётся путь, меньший побайтно.
#   first-wins: побеждает первый (поведение ZH, принято для BFME1). last-wins оставлен только для опытов.
layer base      0    .            recursive  first-wins  *.big
layer patch222  100  .            flat       first-wins  _patch222*.big
layer mobile    200  MobileLayer  recursive  first-wins  *.big
