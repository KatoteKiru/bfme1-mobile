name: Bug report
description: Something does not work as it should
labels: [ "bug" ]

body:
- type: checkboxes
  attributes:
    label: Before you report
    options:
      - label: I searched the existing issues and this is not a duplicate
        required: true
      - label: I am not attaching game files (.big, maps, models, text) to this issue
        required: true

- type: input
  attributes:
    label: App version or commit
    description: Shown in the launcher, or the commit you built from
  validations:
    required: true

- type: input
  attributes:
    label: Device and Android version
    placeholder: Pixel 8 Pro, Android 15
  validations:
    required: true

- type: input
  attributes:
    label: Game data
    description: Game version and patch you imported
    placeholder: BFME1 1.03 + patch 2.22
  validations:
    required: false

- type: textarea
  attributes:
    label: What happened
    description: What happened, and what you expected instead
  validations:
    required: true

- type: textarea
  attributes:
    label: Steps to reproduce
    placeholder: |
      1. Start a skirmish on [map] as [faction]
      2. Do [action]
      3. See [bug]
  validations:
    required: true

- type: textarea
  attributes:
    label: Logs and screenshots
    description: Attach `generals-stderr.log` from the launcher's Diagnostics screen if you can
  validations:
    required: false
